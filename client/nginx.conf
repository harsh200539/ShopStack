server { listen 80; root /usr/share/nginx/html; location / { try_files $uri /index.html; } location /api/ { proxy_pass http://server:5002; proxy_set_header Host $host; } location /socket.io/ { proxy_pass http://server:5002; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } }
