services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shopstack
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopstack
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or root .env}
      CLIENT_URL: http://localhost:${WEB_PORT:-8080}
      PORT: 5002
      SEED_PASSWORD: ${SEED_PASSWORD:-local-demo-password-change-me}
      PAYMENT_MODE: demo
    ports: ["${API_PORT:-5002}:5002"]
    volumes: ["uploads:/app/server/uploads"]
    depends_on:
      db:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [server]
volumes:
  postgres-data:
  uploads:
